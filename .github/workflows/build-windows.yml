name: Build Mitti for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch 3D assets
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-assets.ps1

      - name: Restore
        run: dotnet restore Mitti/Mitti.csproj

      - name: Publish
        shell: powershell
        run: |
          if (Test-Path artifacts) { Remove-Item artifacts -Recurse -Force }
          New-Item -ItemType Directory -Force artifacts/publish | Out-Null
          dotnet publish Mitti/Mitti.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish

      - name: Download WebView2 Bootstrapper
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/WebView2 | Out-Null
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile artifacts/WebView2/MicrosoftEdgeWebview2Setup.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Installer/Mitti.iss

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Mitti-Windows
          path: artifacts/publish

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mitti-Setup
          path: artifacts/installer/MittiSetup.exe
