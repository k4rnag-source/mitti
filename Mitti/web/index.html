<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;width:100%;height:100%}
</style>
<script type="importmap">
{"imports":{"three":"./three.module.min.js"}}
</script>
</head>
<body>
<div id="status" style="position:absolute;left:16px;bottom:12px;font:13px Segoe UI,Arial;color:#d7dde6;opacity:.75;z-index:10">Mitti loading...</div>
<div id="fallback" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;z-index:9">
  <svg width="320" height="240" viewBox="0 0 320 240" aria-label="Mitti">
    <g fill="#111820" stroke="#9aa7b5" stroke-width="4" stroke-linejoin="round">
      <ellipse cx="162" cy="145" rx="82" ry="46"/>
      <circle cx="239" cy="111" r="34"/>
      <path d="M255 83 Q283 62 273 110 Q269 128 252 121 Z"/>
      <path d="M99 113 Q52 79 59 121 Q65 141 99 133 Z"/>
      <path d="M93 174 L88 211 L108 211 L119 177 Z"/>
      <path d="M138 182 L135 214 L155 214 L162 184 Z"/>
      <path d="M201 180 L202 214 L222 214 L218 174 Z"/>
      <path d="M230 128 Q279 155 261 179 Q248 191 232 174 Z"/>
      <circle cx="251" cy="105" r="4" fill="#E8EEF5" stroke="none"/>
      <circle cx="252" cy="105" r="2" fill="#101010" stroke="none"/>
      <path d="M263 120 Q251 131 239 120" fill="none"/>
    </g>
    <text x="160" y="45" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#d7dde6" stroke="none">Mitti</text>
  </svg>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './GLTFLoader.js';

const loader = new GLTFLoader();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, innerWidth/innerHeight, .01, 100);
camera.position.set(0,.82,3.1);
camera.lookAt(0,.62,0);

const renderer = new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.setClearColor(0,0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x253040,2.2));
const key = new THREE.DirectionalLight(0xffffff,3.1); key.position.set(2,4,3); scene.add(key);
const rim = new THREE.DirectionalLight(0x9cc4ff,1.2); rim.position.set(-3,2,-3); scene.add(rim);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(.75,48),
  new THREE.ShadowMaterial({opacity:.18})
);
shadow.rotation.x=-Math.PI/2; shadow.position.y=.005; shadow.receiveShadow=true; scene.add(shadow);

const st={standing:null,sitting:null,lying:null,current:null,mode:'idle',moving:false,paused:false,t:0,yaw:0};

function darken(root){
  root.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow=true;
    o.receiveShadow=true;
    const ms=Array.isArray(o.material)?o.material:[o.material];
    o.material=ms.map(m=>{
      const x=m.clone?.()||new THREE.MeshStandardMaterial();
      x.color=new THREE.Color(.018,.022,.028);
      x.roughness=.34;
      x.metalness=0;
      return x;
    });
  });

  // The source GLBs use very large world units. Normalize them so the
  // Labrador actually fits inside the camera frustum.
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 1.85 / Math.max(maxDim, 0.0001);

  root.scale.setScalar(scale);
  root.position.x -= center.x * scale;
  root.position.z -= center.z * scale;
  root.position.y -= box.min.y * scale;
}

function load(path){
  return new Promise((resolve,reject)=>loader.load(path,g=>{
    darken(g.scene); resolve(g.scene);
  },undefined,reject));
}

function swap(model){
  if(!model) return;
  if(st.current) scene.remove(st.current);
  st.current=model;
  // Keep the normalized model position from darken().
  st.current.rotation.y=st.yaw;
  scene.add(st.current);
}

async function init(){
  const status=document.getElementById('status');
  try{
    status.textContent='Mitti loading...';
    st.standing=await load('/Assets/3D/standing.glb');
    st.sitting=await load('/Assets/3D/sitting.glb');
    st.lying=await load('/Assets/3D/lying.glb');
    swap(st.standing);
    status.style.display='none';
  }catch(e){
    console.error('Mitti 3D load failed',e);
    status.textContent='3D model load failed — showing Mitti fallback';
    document.getElementById('fallback').style.display='flex';
  }
}

window.Mitti={
  start:init,
  pause:v=>st.paused=!!v,
  setMoving:v=>st.moving=!!v,
  setState:s=>{
    st.mode=s;
    if(s==='sit') swap(st.sitting);
    else if(s==='sleep') swap(st.lying);
    else swap(st.standing);
  },
  perch:()=>{st.mode='perch';swap(st.sitting)}
};

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,1/60);
  if(!st.paused&&st.current){
    st.t+=dt;
    const bob=st.mode==='sleep'
      ?Math.sin(st.t*1.4)*.006
      :st.mode==='sit'
      ?Math.sin(st.t*2)*.012
      :st.moving
      ?Math.abs(Math.sin(st.t*8))*.024
      :Math.sin(st.t*2.7)*.008;
    st.current.position.y=bob;
    st.current.rotation.y=st.yaw+(st.moving?Math.sin(st.t*8)*.01:0);
    st.current.rotation.z=st.mode==='happy'?Math.sin(st.t*6)*.025:st.current.rotation.z*.9;
  }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
});
frame();
</script>
</body>
</html>
